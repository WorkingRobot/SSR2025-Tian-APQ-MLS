[workspace]
members = [
  "app",
  "hpke-rs/rust_crypto_provider",
  "hpke-rs/traits",
  "openmls/basic_credential",
  "openmls/memory_storage",
  "openmls/openmls",
  "openmls/openmls_rust_crypto",
  "openmls/openmls_test",
  "openmls/traits",
]
resolver = "3"

[workspace.dependencies]
# OpenMLS crates (local PQ-modified forks)
openmls = { path = "./openmls/openmls", default-features = false }
openmls_traits = { path = "./openmls/traits", default-features = false }
openmls_rust_crypto = { path = "./openmls/openmls_rust_crypto", default-features = false }
openmls_basic_credential = { path = "./openmls/basic_credential", default-features = false }
openmls_memory_storage = { path = "./openmls/memory_storage", default-features = false }
openmls_test = { path = "./openmls/openmls_test", default-features = false }
openmls_libcrux_crypto = { path = "./openmls/libcrux_crypto", default-features = false }
openmls_sqlite_storage = { path = "./openmls/sqlite_storage", default-features = false }

# HPKE crates (local PQ-modified forks)
hpke-rs = { path = "./hpke-rs", default-features = false }
hpke-rs-crypto = { path = "./hpke-rs/traits", default-features = false }
hpke-rs-rust-crypto = { path = "./hpke-rs/rust_crypto_provider", default-features = false }

# Shared dependencies
tls_codec = { version = "0.4", features = ["derive", "serde", "mls"] }

[patch.crates-io]
# Local PQ-modified forks override crates.io versions
hpke-rs = { path = "./hpke-rs" }
hpke-rs-rust-crypto = { path = "./hpke-rs/rust_crypto_provider" }
hpke-rs-crypto = { path = "./hpke-rs/traits" }
openmls = { path = "./openmls/openmls" }
openmls_traits = { path = "./openmls/traits" }
openmls_rust_crypto = { path = "./openmls/openmls_rust_crypto" }
openmls_basic_credential = { path = "./openmls/basic_credential" }
openmls_memory_storage = { path = "./openmls/memory_storage" }
openmls_test = { path = "./openmls/openmls_test" }
openmls_libcrux_crypto = { path = "./openmls/libcrux_crypto" }
openmls_sqlite_storage = { path = "./openmls/sqlite_storage" }

# RustCrypto pre-release PQ dependencies
kem = { git = "https://github.com/RustCrypto/traits.git" }
ml-kem = { git = "https://github.com/RustCrypto/KEMs.git" }
x-wing = { git = "https://github.com/RustCrypto/KEMs.git" }
